name: Bump Currently formula

on:
  workflow_dispatch:
  schedule:
    - cron: "47 6 * * *"

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: bump-currently
  cancel-in-progress: false

jobs:
  bump:
    # Release metadata and static formula validation do not require a Mac.
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          token: ${{ github.token }}

      - name: Resolve latest Currently macOS release
        id: release
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="$({
            gh api --paginate --slurp \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/duskglow/currently/releases?per_page=100"
          } | ruby -rjson -rrubygems -e '
            releases = JSON.parse(STDIN.read).flatten
            matches = releases.filter_map do |candidate|
              next if candidate["draft"]

              match = candidate["tag_name"].to_s.match(/\Av(\d+(?:\.\d+){2,}(?:[-.][0-9A-Za-z.-]+)?)\z/)
              next unless match

              version = match[1]
              next unless %w[arm64 amd64].all? { |arch|
                candidate.fetch("assets", []).any? { |asset|
                  asset["name"] == "currently_#{version}_darwin_#{arch}.tar.gz"
                }
              }

              [Gem::Version.new(version), version]
            end

            selected = matches.max_by(&:first)
            abort "No Currently release with both macOS archives was found" unless selected

            puts selected.last
          ')"

          current_version="$(sed -nE 's/^  release = "([^"]+)"$/\1/p' Formula/currently.rb)"

          if ruby -rrubygems -e 'exit(Gem::Version.new(ARGV[0]) > Gem::Version.new(ARGV[1]) ? 0 : 1)' \
            "$release" "$current_version"
          then
            update=true
          else
            update=false
          fi

          printf 'version=%s\nupdate=%s\n' \
            "$release" "$update" >>"$GITHUB_OUTPUT"

      - name: Check for an existing bump pull request
        id: existing-pr
        if: steps.release.outputs.update == 'true'
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          branch="bump-currently-$VERSION"
          url="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$branch" \
            --state open \
            --json url \
            --jq '.[0].url // empty')"

          if [[ -n "$url" ]]; then
            exists=true
          else
            exists=false
          fi

          printf 'branch=%s\nexists=%s\nurl=%s\n' \
            "$branch" "$exists" "$url" >>"$GITHUB_OUTPUT"

      - name: Install cosign
        if: steps.release.outputs.update == 'true' && steps.existing-pr.outputs.exists != 'true'
        uses: sigstore/cosign-installer@v3

      - name: Update formula from signed release checksums
        if: steps.release.outputs.update == 'true' && steps.existing-pr.outputs.exists != 'true'
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release download "v$VERSION" --repo duskglow/currently --dir "$RUNNER_TEMP" \
            --pattern checksums.txt --pattern checksums.txt.sigstore.json
          cosign verify-blob --bundle "$RUNNER_TEMP/checksums.txt.sigstore.json" \
            --certificate-identity "https://github.com/duskglow/currently/.github/workflows/release.yml@refs/tags/v$VERSION" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$RUNNER_TEMP/checksums.txt"

          ruby - "$RUNNER_TEMP/checksums.txt" <<'RUBY'
          version = ENV.fetch("VERSION")
          manifest = File.readlines(ARGV.fetch(0), chomp: true)
          path = "Formula/currently.rb"
          formula = File.read(path)
          abort "Expected one formula version" unless formula.scan(/^  release = "[^"]+"$/).one?
          formula.sub!(/^  release = "[^"]+"$/, %(  release = "#{version}"))
          formula.sub!(/^  revision \d+\n/, "")
          %w[arm64 amd64].each do |arch|
            filename = "currently_#{version}_darwin_#{arch}.tar.gz"
            digests = manifest.filter_map { |line| line[/\A([0-9a-f]{64})\s+\*?#{Regexp.escape(filename)}\z/, 1] }
            abort "Expected one signed checksum for #{filename}" unless digests.one?
            pattern = /(darwin_#{arch}\.tar\.gz"\n\s+sha256 ")[0-9a-f]{64}"/
            abort "Expected one formula checksum for #{arch}" unless formula.scan(pattern).one?
            formula.sub!(pattern) { "#{$1}#{digests.first}\"" }
          end
          File.write(path, formula)
          RUBY

      - name: Validate formula
        if: steps.release.outputs.update == 'true' && steps.existing-pr.outputs.exists != 'true'
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        run: |
          ruby -c Formula/currently.rb
          brew style Formula/currently.rb
          brew audit --strict --os=tahoe --arch=arm timshadel/tools/currently

      - name: Commit and open pull request
        if: steps.release.outputs.update == 'true' && steps.existing-pr.outputs.exists != 'true'
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        env:
          BRANCH: ${{ steps.existing-pr.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Remote branch $BRANCH already exists without an open pull request" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add Formula/currently.rb
          git commit -m "currently $VERSION"
          git push origin "$BRANCH"

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "currently $VERSION" \
            --body "Updates Currently to $VERSION using the upstream signed macOS archive checksums. Prerelease updates require manual review."

          gh workflow run tests.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          gh workflow run currently-install.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

      - name: Report result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          UPDATE: ${{ steps.release.outputs.update }}
          EXISTING_PR: ${{ steps.existing-pr.outputs.url }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [[ "$JOB_STATUS" != "success" ]]; then
            echo "Currently bump failed; see the workflow logs." >>"$GITHUB_STEP_SUMMARY"
          elif [[ "$UPDATE" != "true" ]]; then
            echo "Currently is already current at $VERSION." >>"$GITHUB_STEP_SUMMARY"
          elif [[ -n "$EXISTING_PR" ]]; then
            echo "A Currently $VERSION bump is already open: $EXISTING_PR" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "Opened a Currently $VERSION bump and dispatched tap tests." >>"$GITHUB_STEP_SUMMARY"
          fi
